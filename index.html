const SNOW_CODES = [71,73,75,77,85,86];

<script type="module">
import * as THREE from 'three';

// ========== 已经填好你的Vercel代理地址 ==========
const baseProxyUrl = "https://snow‑meteo‑proxy.vercel.app/api/proxy‑meteo";

function byId(id){ return document.getElementById(id); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function hhmm(iso){
  if(!iso) return '';
  const d=new Date(iso);
  if(isNaN(d)) return '';
  return pad(d.getHours())+':'+pad(d.getMinutes());
}
function within(iso,h){
  if(!iso) return false;
  const t=new Date(iso).getTime();
  if(isNaN(t)) return false;
  const now=Date.now();
  return t‑now <= h*3600e3 && t‑now > ‑3600e3;
}
function hash(str){
  let h=0;
  for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))|0;
  return h;
}

let mv={order:[],cur:‑1,demo:false,source:''};
function classify(p){
  if(mv.demo) return 'snow';
  if(p.snowing) return 'snow';
  if(p.sleet) return 'sleet';
  if(within(p.next,24)) return 'soon';
  return 'none';
}
function stLabel(st){
  if(st==='snow') return mv.demo?'演示降雪':'正在下雪';
  if(st==='sleet') return '雨夹雪';
  if(st==='soon') return '将下雪';
  return '无雪';
}

async function fromOpenMeteo(){
  const latList=SCENES.map(s=>s.lat).join(',');
  const lonList=SCENES.map(s=>s.lon).join(',');
  const params = new URLSearchParams({
    latitude:latList,
    longitude:lonList,
    current:"weather_code,temperature_2m,snowfall,wind_speed_10m",
    hourly:"snowfall,weather_code",
    forecast_days:"2",
    timezone:"UTC"
  });
  const url = `${baseProxyUrl}?${params.toString()}`;
  const res=await fetch(url,{signal:AbortSignal.timeout(10000)});
  if(!res.ok) throw new Error('http '+res.status);
  const json=await res.json();
  const arr=Array.isArray(json)?json:[json];
  return {
    source:"Open‑Meteo(vercel代理)",
    places:arr.map((r,i)=>{
      const c=r.current||{};
      const hr=r.hourly||{};
      const times=hr.time||[],sf=hr.snowfall||[],hc=hr.weather_code||[];
      let next=null,sum=0,t0=Date.now();
      for(let k=0;k<times.length;k++){
        const tt=new Date(times[k]+(times[k].length>16?'':'Z')).getTime();
        if(tt‑t0 < ‑3600e3) continue;
        if(tt‑t0 > 24*3600e3) break;
        if(SNOW_CODES.includes(hc[k])||SLEET_CODES.includes(hc[k])){
          sum+=(sf[k]||0);
          if(!next) next=new Date(tt).toISOString();
        }
      }
      return {
        id:SCENES[i].id,
        temp:c.temperature_2m!=null?Math.round(c.temperature_2m*10)/10:null,
        wind:c.wind_speed_10m!=null?Math.round(c.wind_speed_10m*10)/10:null,
        code:String(c.weather_code??''),
        snowing:SNOW_CODES.includes(c.weather_code),
        sleet:SLEET_CODES.includes(c.weather_code),
        next,
        mm:Math.round(sum*10)/10
      };
    })
  };
}

function applyWeather(rawPlaces,srcName){
  mv.source=srcName;
  mv.order=SCENES.map(s=>{
    const p=rawPlaces.find(x=>x.id===s.id)??{id:s.id,temp:null,next:null,mm:0};
    return {scene:s,place:p,st:classify(p)};
  });
  buildUISheet();
  const bestIdx=pickDailyDefault();
  setPlace(bestIdx,true);
}

function pickDailyDefault(){
  let bestI=‑1,bestScore=‑1;
  const daySeed=new Date().toISOString().slice(0,10);
  mv.order.forEach((m,i)=>{
    let sc=0;
    if(m.st==='snow') sc=1000+(m.place.mm||0);
    else if(m.st==='sleet') sc=900+(m.place.mm||0);
    else if(m.st==='soon') sc=500‑Math.min(400,Math.max(0,(new Date(m.place.next||0)‑Date.now())/60e3));
    sc+=(Math.abs(hash(daySeed+m.scene.id))%1000)/1000;
    if(sc>bestScore){ bestScore=sc; bestI=i; }
  });
  return bestI<0?0:bestI;
}

async function loadWeather(force=false){
  let cached=null;
  try{ cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){}
  if(!force && cached && Date.now()‑cached.ts < CACHE_MIN*60e3 && cached.places?.length===SCENES.length){
    applyWeather(cached.places,cached.source);
    return;
  }
  setPill('warn','正在获取实时降雪…');
  try{
    const res=await fromOpenMeteo();
    localStorage.setItem(CACHE_KEY,JSON.stringify({ts:Date.now(),places:res.places,source:res.source}));
    applyWeather(res.places,res.source);
  }catch(err){
    console.warn("天气接口失败，使用本地示例数据",err);
    applyWeather(FALLBACK,"本地示例");
  }
}

function setPill(kind,txt){
  const dot=byId('pillDot');
  dot.className='dot'+(kind==='on'?'':kind==='warn'?' warn':' off');
  byId('pillTxt').textContent=txt;
}

function fillWeatherPanel(m){
  const p=m.place,st=m.st;
  byId('wxPlace').textContent=m.scene.name;
  byId('wxTemp').textContent=p.temp!=null?p.temp+'°':'—';
  byId('wxCond').textContent=stLabel(st);
  const rows=[
    ['风速',p.wind!=null?p.wind+' m/s':'—'],
    ['24h降雪',p.mm?p.mm+' cm':'—'],
    ['起雪',within(p.next,24)?hhmm(p.next):'—'],
    ['状态',stLabel(st)]
  ];
  byId('wxRows').innerHTML=rows.map(r=>`<div class="wr"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
}

function setPlace(i,instant){
  if(i<0||i>=mv.order.length) return;
  const m=mv.order[i];
  mv.cur=i;
  const st=m.st;
  window.VS_PENDING=[m.scene.id,st];
  if(window.VS3D?.show) window.VS3D.show(m.scene.id,st);

  const placeDom=byId('place');
  placeDom.classList.toggle('no‑snow',!(st==='snow'||st==='sleet'));
  byId('placeCn').textContent=m.scene.name;
  byId('placeMeta').textContent=m.scene.region;
  placeDom.classList.toggle('quiet',!(st==='snow'||st==='sleet'));
  setPill((st==='snow'||st==='sleet')?'on':'off',m.scene.name);
  fillWeatherPanel(m);
  if(!mv.weather) byId('wxCard').classList.remove('open');
}

function buildUISheet(){
  const snow=[],soon=[],none=[];
  mv.order.forEach((m,i)=>{
    if(m.st==='snow'||m.st==='sleet') snow.push([m,i]);
    else if(m.st==='soon') soon.push([m,i]);
    else none.push([m,i]);
  });
  soon.sort((a,b)=>new Date(a[0].place.next||0)‑new Date(b[0].place.next||0));
  function renderRows(list,dotCls){
    return list.map(x=>{
      const m=x[0],i=x[1];
      const t=m.place.temp!=null?m.place.temp+'°':'';
      const extra = m.st==='soon' && within(m.place.next,24) ? hhmm(m.place.next) : (m.place.mm ? m.place.mm+'cm' : '');
      return `<button class="row${i===mv.cur?' cur':''}${m.st==='none'?' dim':''}" data‑i="${i}">
        <span><span class="nm">${m.scene.name}</span><span class="rg">${m.scene.region}</span></span>
        <span class="rt">${extra?'<span>'+extra+'</span>':''}<span>${t}</span><span class="sd ${dotCls}"></span></span>
      </button>`;
    }).join('');
  }
  let html='';
  if(snow.length) html += '<div class="grp">正在下雪 · '+snow.length+'</div>'+renderRows(snow,'');
  if(soon.length) html += '<div class="grp">雪在路上 · '+soon.length+'</div>'+renderRows(soon,'soon');
  if(none.length) html += '<div class="grp">暂无降雪 · '+none.length+'</div>'+renderRows(none,'none');
  byId('sheetBody').innerHTML=html;
  byId('sheetFoot').innerHTML =
    '<button class="demo‑row" id="demoRow"><span>演示：所有地点下雪</span>'+
    '<span class="toggle" role="switch" aria‑checked="'+(mv.demo?'true':'false')+'" id="demoTog"></span></button>';

  Array.prototype.forEach.call(byId('sheetBody').querySelectorAll('.row'),el=>{
    el.addEventListener('click',()=>{
      setPlace(parseInt(el.getAttribute('data‑i'),10), false);
      closeSheet();
    })
  });

function makeSnow(count, size, alpha, spread, height) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3), seed = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    pos[i * 3] = (Math.random() - .5) * spread;
    pos[i * 3 + 1] = Math.random() * height;
    pos[i * 3 + 2] = (Math.random() - .5) * spread;
    seed[i] = Math.random() * 100;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  const mat = new THREE.PointsMaterial({
    size, map: flakeStreakTex, transparent: true, opacity: alpha, depthWrite: false,
    blending: THREE.AdditiveBlending, sizeAttenuation: true, fog: true

  pts.frustumCulled = false;
  scene.add(pts);

  snowLayers.push(l);
  return l;
}

function jaggedCone(r, hh, seg) {
  const geo = new THREE.ConeGeometry(r, hh, seg, 3);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    if (y > -hh * 0.49) {
      const k = 1 + (Math.random() - 0.5) * 0.22;
      pos.setX(i, pos.getX(i) * k);
      pos.setZ(i, pos.getZ(i) * k);
    }
  }
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, MAT.needle);
}

function fence(g, x0, z0, len, dirX) {
  const grp = new THREE.Group();
  const n = Math.round(len / 1.6);
  for (let i = 0; i <= n; i++) {
    const px = dirX ? x0 + i * (len / n) : x0;
    const pz = dirX ? z0 : z0 + i * (len / n);
    const hh = 1.25 + Math.random() * 0.15;

    grp.add(box(0.34, 0.10, 0.34, MAT.snowBright, px, hh + 0.03, pz));
    if (i < n) {
      const sx = dirX ? (len / n) : 0, sz = dirX ? 0 : (len / n);
      const mid = dirX ? px + sx / 2 : pz + sz / 2;
      grp.add(box(dirX ? sx : 0.08, 0.09, dirX ? 0.08 : sz, MAT.wood, dirX ? mid : px, hh * 0.72, dirX ? pz : mid));

function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function ground(cfg) {
  const size = 420, seg = 170;
  const geo = new THREE.PlaneGeometry(size, size, seg, seg);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const base = new THREE.Color(0x24313f), bright = new THREE.Color(0xeef5fd), c = new THREE.Color();
  const ridges = cfg.ridges || [];
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    let h = (Math.sin(x * .11 + cfg.seed) * .5 + Math.cos(z * .13 - cfg.seed) * .5) * .55;
    h += Math.sin(x * .31 + z * .21) * .18 + Math.sin(x * 1.4) * .05 + Math.cos(z * 1.7) * .05;
    for (const r of ridges) {
      const d = Math.sqrt((x - r.x) ** 2 + (z - r.z) ** 2) / r.r;
      if (d < 1) {
        const shape = Math.pow(1 - d, r.sharp || 1.3);
        const crag = 1 + Math.sin(Math.atan2(z - r.z, x - r.x) * 6) * 0.06 * shape
          + Math.sin(x * 0.09 + z * 0.07) * 0.05 * shape;
        h += r.h * shape * crag;
      }
    }
    if (cfg.street) {
      const ax = Math.abs(x);
      if (ax < 6.5) h = 0;
      else if (ax < 11) h *= (ax - 6.5) / 4.5;
    }
    const rr = Math.sqrt(x * x + (z - 4) * (z - 4));
    if (rr > 48) h -= (rr - 48) * 0.22;
    pos.setY(i, h);
    const t = Math.min(1, Math.max(0, (h - 3) / 12));
    c.copy(base).lerp(bright, 0.22 + 0.78 * Math.pow(t, 1.25));
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .95, metalness: 0, emissive: 0x101c2a, emissiveIntensity: 1 }));
  return mesh;
}

function road(g, cfg) {

  surf.rotation.x = -Math.PI / 2;
  surf.position.set(0, 0.02, -len / 2 + 8);

    const t = new THREE.Mesh(new THREE.PlaneGeometry(0.55, len), new THREE.MeshStandardMaterial({ color: 0x6c8296, roughness: .7 }));
    t.rotation.x = -Math.PI / 2;
    t.position.set(off, 0.035, -len / 2 + 8);
    grp.add(t);
  }
  const rnd = mulberry(cfg.seed + 5);
  for (let i = 0; i < 22; i++) {
    const side = i % 2 ? 1 : -1;
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.45 + rnd() * 0.55, 8, 6), MAT.snow);
    m.scale.set(2.6, 0.32, 1.4);
    m.position.set(side * (6.0 + rnd() * 1.6), 0.02, -50 + i * 5.6 + rnd());
    grp.add(m);
  }
  g.add(grp);
}
